name: Release

# Actions の画面で main を選んで「Run workflow」を押すと、今の main のバージョンで CLI（npm の souieba）を publish し、
# タグ（v0.5.0 など）と GitHub Release を作る。
# バージョンは、dev への PR で `node scripts/set-version.mjs <x.y.z>` を実行して上げておき、dev を main にマージしてから押す。
# すでに publish 済み・Release 作成済みの手順は飛ばすので、途中で失敗したら同じバージョンでもう一度押せばよい。
# サーバのデプロイと MIN_CLIENT_VERSION の引き上げは、ここでは行わない。
# npm への publish は Trusted Publishing（OIDC）で行い、長期のトークンは使わない。provenance は自動で付く。
# 依存のインストールとビルド・テストは権限を絞った build ジョブで行い、公開用の tarball を artifact に置く。
# publish ジョブだけが書き込みと OIDC の権限を持ち、pnpm install もライフサイクルスクリプトも走らせずに tarball を publish する。
# Action はタグの付け替えで中身が変わらないよう、コミットの SHA で固定する。
# 手順: docs/client-distribution-plan.md §5

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./apps/cli/package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$(npm view "souieba@$version" version 2>/dev/null)" ]; then echo "published=true" >> "$GITHUB_OUTPUT"; fi
          if gh release view "v$version" > /dev/null 2>&1; then echo "released=true" >> "$GITHUB_OUTPUT"; fi
      - run: node scripts/check-version.mjs "v${{ steps.version.outputs.version }}"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:cli
      # 公開するのはバンドル済みの1ファイルなので、開発用の依存（workspace:*）は package.json から外してから固める
      - working-directory: apps/cli
        run: |
          npm pkg delete devDependencies scripts
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # GitHub Release（とタグ）を作る
      id-token: write # npm の Trusted Publishing（OIDC）
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing には npm 11.5.1 以上が要る。publish に使う npm は版を固定する
      - run: npm install -g --ignore-scripts npm@11.21.0
      - if: needs.build.outputs.published != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-package
          path: package
      - if: needs.build.outputs.published != 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: npm publish "package/souieba-$VERSION.tgz" --access public --ignore-scripts
      - if: needs.build.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes --title "$TAG"
