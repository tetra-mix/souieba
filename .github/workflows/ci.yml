name: CI

# dev・main への PR と push で、バージョンの揃い・型チェック・テスト・CLI とサイトのビルドを確かめる。
# Release ワークフローも同じ確認をするが、main に入る前に落ちるほうが直しやすいので、PR の段階でも走らせる。

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-version.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:cli
      # サイトのビルドは数秒で済むので、apps/site を変えていない PR でも毎回確かめる
      - run: pnpm --filter @souieba/site build
