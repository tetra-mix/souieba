# Cloudflare Workers の設定。デプロイ手順は README の「Cloudflare Workers」を参照。
#   SOUIEBA_PUBLIC_URL を自分の URL に変えてから wrangler deploy
name = "souieba"
main = "src/worker.ts"
compatibility_date = "2026-09-20"
compatibility_flags = ["nodejs_compat"]
# 今は *.workers.dev で公開している。workers.dev では WAF のレート制限ルールを使えない（Worker 内のレート制限だけで守る）。
# 自分のドメインに移すときは workers_dev = false にして routes を足す（README の「Cloudflare Workers」）
workers_dev = true
preview_urls = false

[vars]
SOUIEBA_PUBLIC_URL = "https://souieba.ryouma1128.workers.dev"
SOUIEBA_POST_GRACE_MINUTES = "0"
# Relay（/v2/*）。アカウントなしで Person を登録できる（off で閉じる）。登録できる Person の数の上限
SOUIEBA_RELAY = "open"
SOUIEBA_MAX_RELAY_AGENTS = "1000"

[[durable_objects.bindings]]
name = "INSTANCE"
class_name = "SouiebaInstance"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SouiebaInstance"]

# 配送期限を過ぎたメッセージ・期限切れのチャレンジやセッションなどを毎日消す
[triggers]
crons = ["17 3 * * *"]

# 送信元 IP ごとのレート制限（Durable Object に届く前に数える）。namespace_id はアカウント内で一意な数字
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# 認証なしの POST（端末の登録・認証の開始など）は、総当たりの対象なので別に厳しく数える
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
