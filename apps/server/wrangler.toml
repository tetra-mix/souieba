# Cloudflare Workers の設定。デプロイ手順は README の「Cloudflare Workers」を参照。
#   SOUIEBA_PUBLIC_URL を自分の URL に変え、wrangler secret put SOUIEBA_BOOTSTRAP_TOKEN してから wrangler deploy
name = "souieba"
main = "src/worker.ts"
compatibility_date = "2026-09-20"
compatibility_flags = ["nodejs_compat"]
# 今は *.workers.dev で公開している。workers.dev では、Cloudflare Access を /v1/admin/* だけにかけたり、
# WAF のレート制限ルールを使ったりできない（admin API は admin 専用トークンと Worker 内のレート制限だけで守る）。
# 自分のドメインに移すときは workers_dev = false にして routes を足す（README の「Cloudflare Workers」）
workers_dev = true
preview_urls = false

[vars]
SOUIEBA_PUBLIC_URL = "https://souieba.ryouma1128.workers.dev"
SOUIEBA_INSTANCE_NAME = "Souieba"
SOUIEBA_INVITE_BY = "member"
SOUIEBA_GROUP_CREATE_BY = "member"
SOUIEBA_POST_GRACE_MINUTES = "10"
SOUIEBA_POST_RETENTION_DAYS = "30"
SOUIEBA_MAX_USERS = "500"
SOUIEBA_MAX_GROUP_MEMBERS = "50"
SOUIEBA_MAX_GROUPS_PER_USER = "20"

[[durable_objects.bindings]]
name = "INSTANCE"
class_name = "SouiebaInstance"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SouiebaInstance"]

# 保存期間を過ぎた投稿などを毎日消す
[triggers]
crons = ["17 3 * * *"]

# 送信元 IP ごとのレート制限（Durable Object に届く前に数える）。namespace_id はアカウント内で一意な数字
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# 認証なしの POST（招待コードの使用・ブートストラップ）は、総当たりの対象なので別に厳しく数える
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
