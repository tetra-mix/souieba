# 素の VPN（WireGuard など）構成。VPN インターフェースの IP だけで待ち受ける。
#   docker compose -f compose.wireguard.yml up -d
# 送信元 IP を正しく判定するため host ネットワークで動かす。
services:
  server:
    image: ${SOUIEBA_IMAGE:-ghcr.io/OWNER/souieba-server:0.1}
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      SOUIEBA_BIND: ${SOUIEBA_BIND:-10.8.0.1}
      SOUIEBA_ALLOWED_CIDRS: ${SOUIEBA_ALLOWED_CIDRS:-10.8.0.0/24}
      SOUIEBA_TRUST_PROXY: none
    volumes:
      - souieba-data:/data

volumes:
  souieba-data:
