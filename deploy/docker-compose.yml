# Tailscale 構成（標準）。ホストのポートは一切公開しない。
#   cp .env.example .env && 編集 → docker compose up -d
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-souieba}        # → https://souieba.<tailnet>.ts.net
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?.env に TS_AUTHKEY を設定してください}  # tag:souieba を付けた事前認証キー
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ts-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]

  server:
    image: ${SOUIEBA_IMAGE:-souieba-server:local}
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    # tailscale コンテナとネットワーク名前空間を共有し、127.0.0.1:8080 だけで待ち受ける
    network_mode: service:tailscale
    depends_on: [tailscale]
    # .env を丸ごと渡さず、必要な変数だけを渡す（TS_AUTHKEY をサーバのコンテナに入れないため）
    environment:
      SOUIEBA_BIND: 127.0.0.1
      SOUIEBA_PUBLIC_URL: ${SOUIEBA_PUBLIC_URL:?.env に SOUIEBA_PUBLIC_URL を設定してください}
      SOUIEBA_INSTANCE_NAME: ${SOUIEBA_INSTANCE_NAME:-Souieba}
      SOUIEBA_INVITE_BY: ${SOUIEBA_INVITE_BY:-member}
      SOUIEBA_POST_GRACE_MINUTES: ${SOUIEBA_POST_GRACE_MINUTES:-10}
      SOUIEBA_POST_RETENTION_DAYS: ${SOUIEBA_POST_RETENTION_DAYS:-30}
    volumes:
      - souieba-data:/data

volumes:
  ts-state:
  souieba-data:
