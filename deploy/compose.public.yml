# インターネット公開の構成（VPS など）。Caddy が HTTPS を終端し、サーバはホストに公開しない。
#   cp .env.public.example .env.public && 編集
#   docker compose -f compose.public.yml --env-file .env.public up -d
# 投稿本文は E2EE なので、サーバ（とその管理者・VPS 事業者）は本文を読めない。
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SOUIEBA_DOMAIN: ${SOUIEBA_DOMAIN:?.env.public に SOUIEBA_DOMAIN を設定してください}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [server]

  server:
    image: ${SOUIEBA_IMAGE:-souieba-server:local}
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    # ports は書かない。同じ Docker ネットワークの Caddy からだけ届く
    expose: ["8080"]
    environment:
      SOUIEBA_EXPOSURE: public
      SOUIEBA_BIND: 0.0.0.0
      # Caddy は Docker のブリッジ（プライベート IP）から接続してくる
      SOUIEBA_TRUST_PROXY: private
      SOUIEBA_PUBLIC_URL: https://${SOUIEBA_DOMAIN}
      SOUIEBA_INSTANCE_NAME: ${SOUIEBA_INSTANCE_NAME:-Souieba}
      SOUIEBA_INVITE_BY: ${SOUIEBA_INVITE_BY:-member}
      SOUIEBA_GROUP_CREATE_BY: ${SOUIEBA_GROUP_CREATE_BY:-member}
      SOUIEBA_POST_GRACE_MINUTES: ${SOUIEBA_POST_GRACE_MINUTES:-10}
      SOUIEBA_POST_RETENTION_DAYS: ${SOUIEBA_POST_RETENTION_DAYS:-14}
    volumes:
      - souieba-data:/data

volumes:
  caddy-data:
  caddy-config:
  souieba-data:
